plugins { id 'com.android.application' }

def releaseKey = System.getenv('RMWEATHER_KEYSTORE_PATH')
def buildNumber = Integer.parseInt(System.getenv('RMWEATHER_BUILD_NUMBER') ?: '1')
android {
    namespace 'io.github.rachane16.rmweather'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.rachane16.rmweather'
        minSdk 24
        targetSdk 36
        versionCode 10000 + buildNumber
        versionName "1.0.${buildNumber}"
    }
    signingConfigs {
        release {
            if (releaseKey) {
                storeFile file(releaseKey)
                storeType 'PKCS12'
                storePassword System.getenv('RMWEATHER_STORE_PASSWORD')
                keyAlias System.getenv('RMWEATHER_KEY_ALIAS')
                keyPassword System.getenv('RMWEATHER_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
tasks.configureEach {
    if (name == 'validateSigningRelease') doFirst {
        if (!releaseKey) throw new GradleException('Configure the RMWEATHER signing environment before a release build; no debug-key fallback is allowed.')
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
