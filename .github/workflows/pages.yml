name: Update data and publish RMWeather
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: node --check assets/app.js
      - run: node --check assets/layers.js
      - run: node --check assets/hydro.js
      - run: node --check assets/map-engine.js
      - run: node --check assets/weather-tools.js
      - run: node --check assets/display.js
      - run: node --test tests/*.test.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check certifi
      - run: python scripts/sync_data.py
      - name: Update Songkhla Windy webcams
        run: python scripts/sync_windy.py
        env:
          WINDY_WEBCAMS_API_KEY: ${{ secrets.WINDY_WEBCAMS_API_KEY }}
      - uses: actions/configure-pages@v5
      - name: Package public files only
        run: |
          mkdir -p _site
          cp index.html legacy.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      # Uploaded artifacts can take a few seconds to appear in the Pages API.
      - name: Wait for artifact metadata after a transient deployment failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
