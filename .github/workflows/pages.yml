name: Update data and publish RMWeather
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: node --check assets/timezone.js
      - run: node --check assets/app.js
      - run: node --check assets/layers.js
      - run: node --check assets/hydro.js
      - run: node --check assets/radargis.js
      - run: node --check assets/map-engine.js
      - run: node --check assets/weather-tools.js
      - run: node --check assets/windy-embed.js
      - run: node --check assets/display.js
      - run: node --check assets/development-access.js
      - run: node --check assets/development.js
      - run: node --check assets/development-data.js
      - run: node --check assets/workspace-ui.js
      - run: node --check assets/precipitation-legend.js
      - run: node --check assets/app-update.js
      - run: node --test tests/*.test.js
      - name: Check public RadarGIS access from the runner
        if: github.event_name == 'pull_request'
        run: python scripts/sync_radargis.py --probe
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: radargis-connectivity
          path: _radargis_probe.json
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check certifi
      - run: python scripts/sync_data.py
      - name: Read TMD RadarGIS catalog
        id: radargis_catalog
        run: python scripts/sync_radargis.py --catalog
      - uses: actions/cache/restore@v4
        id: radargis_cache
        with:
          path: |
            data/live/radargis.json
            data/live/radargis
          key: radargis-v2-${{ steps.radargis_catalog.outputs.key }}
          restore-keys: radargis-v2-
      - name: Update TMD RadarGIS overlays
        id: radargis_sync
        run: python scripts/sync_radargis.py
      - uses: actions/cache/save@v4
        if: steps.radargis_sync.outputs.ok == 'true' && steps.radargis_cache.outputs.cache-hit != 'true'
        with:
          path: |
            data/live/radargis.json
            data/live/radargis
          key: radargis-v2-${{ steps.radargis_catalog.outputs.key }}
      - name: Update Thailand Windy webcams
        run: python scripts/sync_windy.py
        env:
          WINDY_WEBCAMS_API_KEY: ${{ secrets.WINDY_WEBCAMS_API_KEY }}
      - name: Restore forecast cache with updater credentials
        id: development_restore
        continue-on-error: true
        run: python scripts/development_storage.py --restore
        env:
          DEVELOPMENT_UPLOAD_TOKEN: ${{ secrets.DEVELOPMENT_UPLOAD_TOKEN }}
      - name: Refresh forecast datasets
        id: development_sync
        if: steps.development_restore.outcome == 'success'
        continue-on-error: true
        run: python scripts/sync_development.py
      - name: Upload forecast datasets using updater credentials
        if: steps.development_sync.outcome == 'success'
        continue-on-error: true
        run: python scripts/development_storage.py
        env:
          DEVELOPMENT_UPLOAD_TOKEN: ${{ secrets.DEVELOPMENT_UPLOAD_TOKEN }}
      - uses: actions/configure-pages@v5
      - name: Package public files only
        run: python scripts/package_public.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # Uploaded artifacts can take a few seconds to appear in the Pages API.
      - name: Wait for artifact metadata after a transient deployment failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
