name: Build RMWeather Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'index.html', 'legacy.html', 'assets/**', 'tests/**']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'index.html', 'legacy.html', 'assets/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    # A desktop-only UI fix must not publish a new Android release.
    if: >-
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[desktop-only]')) &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.title, '[desktop-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test and lint the Android application
        env:
          RMWEATHER_BUILD_NUMBER: ${{ github.run_number }}
        run: bash android/gradlew -p android --no-daemon testDebugUnitTest lintRelease assembleDebug
      - name: Prepare release signing from encrypted repository secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.RMWEATHER_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Android signing secret is missing'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rmweather-release.p12"
          chmod 600 "$RUNNER_TEMP/rmweather-release.p12"
      - name: Build a signed release APK
        if: github.event_name != 'pull_request'
        env:
          RMWEATHER_KEYSTORE_PATH: ${{ runner.temp }}/rmweather-release.p12
          RMWEATHER_STORE_PASSWORD: ${{ secrets.RMWEATHER_ANDROID_STORE_PASSWORD }}
          RMWEATHER_KEY_PASSWORD: ${{ secrets.RMWEATHER_ANDROID_KEY_PASSWORD }}
          RMWEATHER_KEY_ALIAS: ${{ secrets.RMWEATHER_ANDROID_KEY_ALIAS }}
          RMWEATHER_BUILD_NUMBER: ${{ github.run_number }}
        run: bash android/gradlew -p android --no-daemon assembleRelease
      - name: Collect and verify installable APK
        env:
          RELEASE_BUILD: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p android/distribution
          if [ "$RELEASE_BUILD" = true ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/distribution/RMWeather.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk android/distribution/RMWeather.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/distribution/RMWeather.apk > android/distribution/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/distribution/RMWeather.apk > android/distribution/package.txt
          grep "package: name='io.github.rachane16.rmweather'" android/distribution/package.txt
          grep "application-label:'RMWeather'" android/distribution/package.txt
          (cd android/distribution && sha256sum RMWeather.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RMWeather-Android
          path: android/distribution/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-build-reports
          path: android/app/build/reports/
      - name: Remove the runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rmweather-release.p12"
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RMWeather-Android
          path: android/distribution
      - name: Enable KVM for the isolated test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8,1.1.1.1
          script: TEST_RELEASE_UPGRADE=${{ github.event_name != 'pull_request' }} bash android/scripts/smoke-test.sh android/distribution/RMWeather.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RMWeather-Android-device-test
          path: android-smoke/
  publish:
    if: github.event_name != 'pull_request'
    needs: [build, device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RMWeather-Android
          path: distribution
      - name: Publish the verified signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          tag="android-v1.4.$BUILD_NUMBER"
          printf 'RMWeather for Android 7.0 and later.\n\nSigned APK using the persistent RMWeather release key. Requires internet access; opens the live RMWeather website. Location access is optional.\n\nSource: %s\n' "$COMMIT_SHA" > release-notes.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$COMMIT_SHA" --title "RMWeather Android 1.4.$BUILD_NUMBER" --notes-file release-notes.txt --latest
          fi
          gh release upload "$tag" distribution/RMWeather.apk distribution/SHA256SUMS.txt distribution/signature.txt --clobber
